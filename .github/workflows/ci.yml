name: Skill CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-package:
    name: Security and package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run skill, security, alpha, and bundle tests
        run: python -m unittest discover -s tests -v

      - name: Verify reproducible skill bundle
        run: python scripts/package_skill.py --check

      - name: Check command help without network access
        run: |
          python skill/scripts/run_codex_imagegen.py --help
          python skill/scripts/verify_png_alpha.py --help
          python skill/scripts/image_project.py --help
          python skill/scripts/solidify_png_alpha.py --help
